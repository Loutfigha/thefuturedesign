name: Deploy naar Vimexx hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Uploaden naar Vimexx via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.VIMEXX_FTP_HOST }}
          username: ${{ secrets.VIMEXX_FTP_USERNAME }}
          password: ${{ secrets.VIMEXX_FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.VIMEXX_FTP_TARGET_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            **/CLAUDE.md
            **/README.md
